name: Integration

on: push

jobs:
  build-and-lint:
    name: Build and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs before Build and Lint because it explains their failure modes: a
      # forked mobx breaks tsc, and a typescript past typescript-eslint's peer
      # range stops eslint loading at all
      - name: Host-supplied deps agree with the host, typescript with eslint
        run: pnpm check-host-dep-pins
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: No source file git would call binary
        run: pnpm check-text-source
      - name: EBI still accepts every database and tool the panel offers
        run: pnpm check-ebi-params
      - name: Every @mui/material import exists on the host
        run: pnpm check-mui-imports
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # Boots the CANDIDATE build on hosted JBrowse releases against a config that
  # actually names this plugin. The `test` job below runs on a `jbrowse create`
  # install -- the host we develop on -- so it cannot see the failures that only
  # exist on hosts already in the wild, which is where the damage lands: the
  # store serves `latest/` no-cache, so a publish reaches configs shipped months
  # ago with no staging step. See the script header for the two outages that got
  # through tsc, eslint, and a url check.
  host-compat:
    name: Host compat (candidate build on hosted releases)
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Install Puppeteer browsers
        run: npx puppeteer browsers install chrome
      - name: Boot the built bundle on released hosts
        run: pnpm host-compat --json host-compat.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: host-compat
          path: host-compat.json

  test:
    name: Test production builds
    needs: build-and-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v4.3.0 is the release most users are actually on, so the UI gets
        # driven there and not only load-probed by host-compat. v3.7.0 stays
        # because it is the only leg sensitive to the legacy context-menu shape.
        jbrowse-version: [nightly, v4.3.0, v3.7.0]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest
      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Setup JBrowse ${{ matrix.jbrowse-version }}
        run: |
          if [ "${{ matrix.jbrowse-version }}" = "nightly" ]; then
            pnpm dlx @jbrowse/cli create .test-jbrowse --nightly
          else
            pnpm dlx @jbrowse/cli create .test-jbrowse-${{ matrix.jbrowse-version }} --tag ${{ matrix.jbrowse-version }}
          fi
      - name: Install Puppeteer browsers
        run: npx puppeteer browsers install chrome
      - name: Run tests
        run: pnpm vitest run
        env:
          TEST_JBROWSE_VERSION: ${{ matrix.jbrowse-version }}
      # saveStableScreenshot only rewrites a reference that moved more than its
      # tolerance, so a clean tree is the expected state and a dirty one means
      # the committed image no longer shows what the app does. 2.10.1 shipped
      # five references captured between a bug and its fix, still displaying the
      # eutils CORS error; every run since rewrote them into an artifact nobody
      # opens. Recapture with a local run and commit rather than muting this.
      #
      # Advisory on nightly only, where the host itself moves and a red would be
      # someone else's UI change; on a pinned host it is ours and it blocks.
      - name: Screenshot references still match the run
        run: git diff --exit-code -- test-screenshots/
        continue-on-error: ${{ matrix.jbrowse-version == 'nightly' }}
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-${{ matrix.jbrowse-version }}
          path: test-screenshots/
